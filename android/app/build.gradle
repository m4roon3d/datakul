plugins { id 'com.android.application' }
// The Android app is the Datakul website as a Trusted Web Activity: the real site, full screen, with no browser bar.
// It needs no code of its own; everything is in AndroidManifest.xml and the resources.
// Version: versionCode must go up with every upload to Google Play. CI passes -PversionCode=<run number>.
def vc = (project.findProperty('versionCode') ?: '1') as Integer
android {
    namespace 'app.datakul'
    compileSdk 36
    defaultConfig { applicationId 'app.datakul'; minSdk 24; targetSdk 36; versionCode vc; versionName '1.0.0' }
    // One fixed debug key (committed on purpose; debug keys are not secret), so every CI build installs over the previous one.
    // Its fingerprint is listed in web/.well-known/assetlinks.json, which is what lets this build open full screen.
    signingConfigs {
        debug { storeFile file('datakul-debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
        // Play upload key: only from environment variables set by the release workflow (GitHub secrets). Never committed.
        release {
            def ks = System.getenv('DATAKUL_UPLOAD_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('DATAKUL_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('DATAKUL_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('DATAKUL_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false; if (System.getenv('DATAKUL_UPLOAD_KEYSTORE')) signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.browser:browser:1.8.0'
}
