<style>
/* Layout: a course catalogue on the Datakul chalk-dot ground. Summary and filters up top (sticky filter bar), then modules as sections with topic rows; build order at the end. Same tokens as the Datakul app. */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#EAF1F4; --ink:#10202B; --muted:#56687A; --line:#DCE4EA; --dot:#D3DDE4;
  --accent:#0E6B8C; --accent-soft:#E0EFF5; --accent-ink:#FFFFFF; --accent-deep:#09506A; --accent-tile:#0E6B8C;
  --flame:#F28C28; --flame-soft:#FFF0DD; --flame-ink:#9A4A00;
  --de:#B4581A; --da:#1C6DB0; --ds:#A23A7A; --ar:#2D7A4C; --good:#2D7A4C; --good-soft:#E3F2E8; --warn:#A66400; --warn-soft:#FBF0DC;
  --shadow:0 1px 2px rgb(16 32 43 / .06),0 8px 24px rgb(16 32 43 / .07);
  --shadow-lift:0 2px 4px rgb(16 32 43 / .07),0 14px 30px rgb(16 32 43 / .10);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-card:20px; --r-ctl:12px;
  --tabh:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B141A; --surface:#13202A; --surface-2:#182A35; --ink:#E6EEF2; --muted:#8FA3AF; --line:#243742; --dot:#1A2B35;
  --accent:#5CC3E6; --accent-soft:#123444; --accent-ink:#06151C; --accent-deep:#2E8FB3; --accent-tile:#0E6B8C;
  --flame:#FFA552; --flame-soft:#2A2218; --flame-ink:#FFC27A;
  --de:#F0A266; --da:#7DB7EC; --ds:#E68CC0; --ar:#7FCB9A; --good:#7FCB9A; --good-soft:#163024; --warn:#E8B45A; --warn-soft:#33270F;
  --shadow:0 1px 2px rgb(0 0 0 / .35),0 8px 24px rgb(0 0 0 / .25);
  --shadow-lift:0 2px 4px rgb(0 0 0 / .4),0 14px 30px rgb(0 0 0 / .3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B141A; --surface:#13202A; --surface-2:#182A35; --ink:#E6EEF2; --muted:#8FA3AF; --line:#243742; --dot:#1A2B35;
  --accent:#5CC3E6; --accent-soft:#123444; --accent-ink:#06151C; --accent-deep:#2E8FB3; --accent-tile:#0E6B8C;
  --flame:#FFA552; --flame-soft:#2A2218; --flame-ink:#FFC27A;
  --de:#F0A266; --da:#7DB7EC; --ds:#E68CC0; --ar:#7FCB9A; --good:#7FCB9A; --good-soft:#163024; --warn:#E8B45A; --warn-soft:#33270F;
  --shadow:0 1px 2px rgb(0 0 0 / .35),0 8px 24px rgb(0 0 0 / .25);
  --shadow-lift:0 2px 4px rgb(0 0 0 / .4),0 14px 30px rgb(0 0 0 / .3); color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

header.top{padding-block:28px 18px;display:flex;flex-direction:column;gap:10px}
header.top h1{font-size:clamp(32px,6.5vw,46px);line-height:1.04;font-weight:800;letter-spacing:-.03em}
.brandrow{display:flex;align-items:center;gap:10px}.brandrow .mk{width:36px;height:36px}.brandrow .wm{height:24px;width:auto}
header.top p{max-width:62ch;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-block:6px 4px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tracks{display:flex;flex-direction:column;gap:9px;padding-block:14px 6px}
.trow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:14px}
.trow .bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.trow .bar i{display:block;height:100%}
.trow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:8px;border-radius:2px;display:inline-block}

.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip{font-weight:700}.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .dot{width:9px;height:9px;border-radius:3px}
.frow select,.frow input{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px}
.frow input{flex:1;min-width:140px}
.count{font-size:13px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}

main{padding-block:10px 40px;display:flex;flex-direction:column;gap:28px}
.trackhead{display:flex;align-items:center;gap:10px;padding-top:4px}
.trackhead::before{content:"";width:14px;height:14px;border-radius:5px;background:var(--tc);flex:none}
.trackhead h2{font-size:26px;font-weight:800;color:var(--ink)}
.trackhead span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.module{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px 16px 6px;box-shadow:var(--shadow)}
section{display:flex;flex-direction:column;gap:12px}
.modhead{display:flex;align-items:baseline;gap:10px;padding-block:6px 4px}
.modhead h3{font-size:17px}
.modhead .pk{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:1px 8px;color:var(--flame-ink);background:var(--flame-soft)}
.modhead .mc{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.topic{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:9px 4px;border-top:1px solid var(--line)}

.topic.flash{background:var(--accent-soft);transition:background .6s}
.lv{font-family:var(--f-mono);font-size:11.5px;font-weight:500;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.lv.F{color:var(--good);background:var(--good-soft)}
.lv.I{color:var(--accent);background:var(--accent-soft)}
.lv.A{color:var(--ds);background:color-mix(in srgb,var(--ds) 14%,transparent)}
.tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tt b{font-weight:700;font-size:15px;line-height:1.35}
.needs{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.needs button{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.st{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;white-space:nowrap;padding-top:3px}
.st.existing{color:var(--good)}
.st.new{color:var(--muted)}
.empty{padding:30px 0;color:var(--muted)}

.order{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.order h2{font-size:24px}
.order ol{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 16px;box-shadow:var(--shadow);margin:0;padding:0;list-style:none;display:flex;flex-direction:column;counter-reset:b}
.order li{counter-increment:b;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.order li:first-child{border-top:0}

.order li::before{content:counter(b);font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.order li b{font-size:15.5px}
.order li small{display:block;color:var(--muted);font-size:13px}
.order li .n{font-family:var(--f-mono);font-size:12.5px;color:var(--good);white-space:nowrap;font-variant-numeric:tabular-nums}
.note{background:var(--flame-soft);box-shadow:inset 4px 0 0 var(--flame);border-radius:14px;padding:14px 16px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
@media (max-width:560px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat b{font-size:24px}.trow{grid-template-columns:96px minmax(0,1fr) 70px}.topic{grid-template-columns:26px minmax(0,1fr)}.st{grid-column:2;padding-top:0}}
@media (max-width:719px){.filters{position:static}#trackChips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}#trackChips .chip{flex:none}}
@media (prefers-reduced-motion:reduce){.topic.flash{transition:none}}
</style>

</div>

    return `<div class="trow"><span>${name}</span><div class="bar" style="width:${(100 * all.length) / max}%"><i style="width:${(100 * e) / all.length}%;background:var(--${k})"></i></div><span class="n">${e} / ${all.length}</span></div>`;
  }).join("");
  $("#trackChips").innerHTML = [["", "All tracks"]].concat(Object.entries(TR)).map(([k, n]) => `<button class="chip" type="button" data-track="${k}" aria-pressed="${fTrack === k}">${k ? `<i class="dot" style="background:var(--${k})"></i>` : ""}${n}</button>`).join("");
}

function render() {
  const pk = $("#fPack").value, lv = $("#fLevel").value, stv = $("#fStatus").value, q = $("#fText").value.trim().toLowerCase();
  const show = T.filter((t) => (!fTrack || t.track === fTrack) && (!pk || t.pack === pk) && (!lv || t.level === lv) && (!stv || t.status === stv) && (!q || (t.title + " " + t.module).toLowerCase().includes(q)));
  $("#count").textContent = `${show.length} of ${T.length}`;
  if (!show.length) { $("#list").innerHTML = `<p class="empty">No topics match these filters.</p>`; return; }
  let html = "";
  for (const k of Object.keys(TR)) {
    const tt = show.filter((t) => t.track === k);
    if (!tt.length) continue;
    html += `<section style="--tc:var(--${k})"><div class="trackhead"><h2>${TR[k]}</h2><span>${tt.length} topics</span></div>`;
    const mods = [...new Set(tt.map((t) => t.module))];
    for (const m of mods) {
      const mt = tt.filter((t) => t.module === m), pack = mt[0].pack;
      const newN = mt.filter((t) => t.status === "new").length;
      html += `<div class="module"><div class="modhead"><h3>${esc(m.replace(/^Domain pack: |^Career: /, ""))}</h3>${PACK[pack] && pack !== "tool" ? `<span class="pk">${PACK[pack]}</span>` : ""}<span class="mc">${mt.length - newN} / ${mt.length} in library</span></div>`;
      html += mt.map((t) => `<div class="topic" id="t-${t.id}"><span class="lv ${t.level}" title="${{ F: "Foundations", I: "Intermediate", A: "Advanced" }[t.level]}">${t.level}</span>
        <span class="tt"><b>${esc(t.title)}</b>${t.prereqs.length ? `<span class="needs">Learn first: ${t.prereqs.map((p) => `<button type="button" data-go="${p}">${esc(byId[p].title)}</button>`).join("")}</span>` : ""}</span>
        <span class="st ${t.status}">${t.status === "existing" ? "✓ in library" : "to write"}</span></div>`).join("");
      html += `</div>`;
    }
    html += `</section>`;
  }
  $("#list").innerHTML = html;
}

function order() {
  $("#order").innerHTML = `<span class="eyebrow">How it was built</span><h2>Written in ${DATA.batches.length} batches</h2>
    <p class="muted">Each batch added about 15 topics, each with a concept card and interview questions. Every batch passed automatic checks: search finds each topic, every sample answer earns full marks, and vague answers don't.</p>
    <ol>${DATA.batches.map((b) => `<li><span><b>${esc(b.name)}</b><small>${b.modules.map((m) => esc(m.replace(/^Domain pack: |^Career: /, ""))).join(" · ")}</small></span><span class="n">${b.new ? b.new + " to write" : "✓ written"}</span></li>`).join("")}</ol>
    <div class="note"><b>Suggest a topic</b><span>Spot a gap, a topic to drop or a level that looks wrong? Leave a comment on this page.</span></div>`;
}

document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-track]");
  if (c) { fTrack = c.dataset.track; stats(); render(); return; }
  const g = e.target.closest("[data-go]");
  if (g) {
    let el = document.getElementById("t-" + g.dataset.go);
    if (!el) { fTrack = ""; ["#fPack", "#fLevel", "#fStatus", "#fText"].forEach((s) => ($(s).value = "")); stats(); render(); el = document.getElementById("t-" + g.dataset.go); }
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400);
  }
});
["#fPack", "#fLevel", "#fStatus"].forEach((s) => $(s).addEventListener("change", render));
$("#fText").addEventListener("input", render);
stats(); render(); order();
</script>
