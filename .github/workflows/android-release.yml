name: Release bundle for Google Play

# Run by hand (Actions → Release bundle for Google Play → Run workflow) when you are ready to upload to the Play Console.
# Needs four repository secrets, set once (Settings → Secrets and variables → Actions); steps are in docs/android.md:
#   DATAKUL_UPLOAD_KEYSTORE_B64    the upload keystore file, base64-encoded
#   DATAKUL_UPLOAD_STORE_PASSWORD  its store password
#   DATAKUL_UPLOAD_KEY_ALIAS       the key alias (e.g. upload)
#   DATAKUL_UPLOAD_KEY_PASSWORD    the key password
# The keystore is written to the runner's temp folder for the build only, never to the repository or the artifact.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the signing secrets are set
        env:
          KS: ${{ secrets.DATAKUL_UPLOAD_KEYSTORE_B64 }}
          SP: ${{ secrets.DATAKUL_UPLOAD_STORE_PASSWORD }}
          KA: ${{ secrets.DATAKUL_UPLOAD_KEY_ALIAS }}
          KP: ${{ secrets.DATAKUL_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing DATAKUL_UPLOAD_KEYSTORE_B64"
          [ -n "$SP" ] || missing="$missing DATAKUL_UPLOAD_STORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing DATAKUL_UPLOAD_KEY_ALIAS"
          [ -n "$KP" ] || missing="$missing DATAKUL_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error title=Signing secrets missing::Add these repository secrets:$missing (see docs/android.md)"; exit 1; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null || true
      - name: Build the signed app bundle
        working-directory: android
        env:
          KS_B64: ${{ secrets.DATAKUL_UPLOAD_KEYSTORE_B64 }}
          DATAKUL_UPLOAD_STORE_PASSWORD: ${{ secrets.DATAKUL_UPLOAD_STORE_PASSWORD }}
          DATAKUL_UPLOAD_KEY_ALIAS: ${{ secrets.DATAKUL_UPLOAD_KEY_ALIAS }}
          DATAKUL_UPLOAD_KEY_PASSWORD: ${{ secrets.DATAKUL_UPLOAD_KEY_PASSWORD }}
        run: |
          set +e
          export DATAKUL_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$KS_B64" | base64 -d > "$DATAKUL_UPLOAD_KEYSTORE"
          gradle bundleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace > build.log 2>&1
          code=$?
          rm -f "$DATAKUL_UPLOAD_KEYSTORE"
          if [ $code -ne 0 ]; then
            grep -n -i -E "error|wrong|failed|not found|exception|what went|keystore" build.log | grep -v -i "password=" | head -25 | tr '\n' '|' | cut -c1-3500 | while read -r l; do echo "::error title=Gradle failure::$l"; done
          fi
          exit $code
      - name: Show the upload certificate and version
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -1)
          SHA=$(keytool -printcert -jarfile "$AAB" | grep -i 'SHA256:' | head -1 | awk '{print $2}')
          if [ -z "$SHA" ]; then echo "::error title=Not signed::The bundle has no signature"; exit 1; fi
          echo "::notice title=Upload certificate SHA-256::$SHA"
          echo "::notice title=Version code::${{ github.run_number }} (versionName from android/app/build.gradle)"
      - uses: actions/upload-artifact@v4
        with:
          name: datakul-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
