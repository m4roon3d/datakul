name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gateway's grader copy matches the app
        run: node tools/sync-grader.mjs --check
      - name: App scripts parse
        run: for f in web/*.js; do node --check "$f" || exit 1; done
      - name: No top-level name declared in two scripts
        run: node tools/check_globals.mjs
      - name: Exam question banks valid and built
        run: node content/build_certs.mjs --check
      - name: Gateway tests
        run: |
          set -o pipefail
          node --no-warnings tests/gateway.mjs 2>&1 | tee "$RUNNER_TEMP/gw.txt" || { grep -E "FAIL|Error" "$RUNNER_TEMP/gw.txt" | head -10 | while read -r l; do echo "::error title=Gateway test::$l"; done; exit 1; }
      - name: Layer 2 tests (database, drafting, review, publish)
        run: |
          set -o pipefail
          node --no-warnings tests/layer2.mjs 2>&1 | tee "$RUNNER_TEMP/l2.txt" || { grep -E "^FAIL|Error" "$RUNNER_TEMP/l2.txt" | head -10 | while read -r l; do echo "::error title=Layer 2 test::$l"; done; exit 1; }
      - name: AI status tests (usage logging, status endpoint, check now)
        run: |
          set -o pipefail
          node --no-warnings tests/status.mjs 2>&1 | tee "$RUNNER_TEMP/st.txt" || { grep -E "^FAIL|Error" "$RUNNER_TEMP/st.txt" | head -10 | while read -r l; do echo "::error title=Status test::$l"; done; exit 1; }
      - name: Gateway bundles for Cloudflare (dry run, no account needed)
        working-directory: worker
        run: npx --yes wrangler@4.112.0 deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Start the test server (real gateway, test database, stubbed AI)
        run: |
          node --no-warnings tests/l2server.mjs 8788 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 2
          cat "$RUNNER_TEMP/server.log"
      - name: Browser tests (app and review page)
        run: |
          set -o pipefail
          python3 tests/l2ui.py 2>&1 | tee "$RUNNER_TEMP/ui.txt" || { grep -E "^FAIL|Error" "$RUNNER_TEMP/ui.txt" | head -10 | while read -r l; do echo "::error title=Browser test::$l"; done; exit 1; }
      - name: Theme tests (Auto, Light, Dark, Pitch dark)
        run: |
          set -o pipefail
          python3 tests/themes.py 2>&1 | tee "$RUNNER_TEMP/th.txt" || { grep -E "^FAIL|Error" "$RUNNER_TEMP/th.txt" | head -10 | while read -r l; do echo "::error title=Theme test::$l"; done; exit 1; }
      - name: Teach-me tests (model answers, lesson, recall)
        run: |
          set -o pipefail
          python3 tests/teach.py 2>&1 | tee "$RUNNER_TEMP/te.txt" || { grep -E "^FAIL|Error" "$RUNNER_TEMP/te.txt" | head -10 | while read -r l; do echo "::error title=Teach test::$l"; done; exit 1; }
      - name: AI status page tests
        run: |
          set -o pipefail
          python3 tests/status_ui.py 2>&1 | tee "$RUNNER_TEMP/su.txt" || { grep -E "^FAIL|Error" "$RUNNER_TEMP/su.txt" | head -10 | while read -r l; do echo "::error title=Status page test::$l"; done; exit 1; }
      - name: Exam prep tests (diagnostic, practice, mock exam)
        run: |
          set -o pipefail
          python3 tests/exam.py 2>&1 | tee "$RUNNER_TEMP/ex.txt" || { grep -E "^FAIL|Error" "$RUNNER_TEMP/ex.txt" | head -10 | while read -r l; do echo "::error title=Exam prep test::$l"; done; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true   # screenshots are a nice-to-have; the account's artifact storage is shared with Hodlr's APKs
        with:
          retention-days: 3
          name: screenshots
          path: tests/out/*.png
          if-no-files-found: ignore
