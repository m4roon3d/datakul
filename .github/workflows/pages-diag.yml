name: Pages diagnosis (temporary, read-only)
on:
  push:
    branches: [diag/pages-prod]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tools/pages_promote.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: sleep 30
      - run: node tools/pages_diag.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          for u in "https://datakul.pages.dev/certs.js" "https://datakul.pages.dev/certs.js?v=$RANDOM" "https://6a4ee47e.datakul.pages.dev/certs.js"; do
            printf "%s " "$u"; curl -s -D /tmp/h -o /tmp/b "$u"; wc -c < /tmp/b | tr -d '\n'; printf " gov=%s " "$(grep -c 'One policy for every PII column' /tmp/b)"; grep -i -E "^cf-ray|^etag" /tmp/h | tr -d '\r' | tr '\n' ' '; echo
          done
