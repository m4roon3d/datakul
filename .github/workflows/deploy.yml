name: Deploy

# Every merge to main deploys the database changes, the AI gateway and the website to Cloudflare.
# Run by hand from Actions → Deploy → Run workflow to redeploy, for example after changing a secret.
# One-time setup: docs/setup.md (four repository secrets). Without them this workflow skips and says what's missing.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the setup secrets
        id: gate
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning title=Not deployed yet::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (docs/setup.md), then run this workflow again."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: '22'
      - name: Tests must pass before deploying
        if: steps.gate.outputs.go == 'yes'
        run: |
          node tools/sync-grader.mjs --check
          node --no-warnings tests/gateway.mjs > /dev/null
          node --no-warnings tests/layer2.mjs > /dev/null
          node --no-warnings tests/status.mjs > /dev/null
      - name: Deploy database, gateway and website
        if: steps.gate.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          EXTRA_ORIGINS: ${{ vars.EXTRA_ORIGINS }}
        run: node tools/deploy.mjs
